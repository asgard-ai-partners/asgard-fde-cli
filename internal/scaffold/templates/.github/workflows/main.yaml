# .github/workflows/main.yaml
#
# tag 觸發 rollout,部署所有「在 deploy.yaml 有宣告該環境」的 project(沒宣告的會被跳過):
#   dev-X.Y.Z → dev cluster(asgard-ai-eks)
#   X.Y.Z     → prod cluster(asgard-ai-eks-prod)
#
# 兩段式:
#   1. setup  —— 依 tag 決定環境/cluster;掃 projects/*/deploy.yaml,凡是該 project 的 deploy.yaml
#                「有宣告這個 env」就展開成一個 matrix 項目(project + namespace + values)。
#   2. deploy —— 吃 setup 的 matrix,**每個 project 一個獨立平行 job**,各自 helm upgrade 到自己的
#                namespace;部署後主動觸發該 namespace 的 Syncer 一次並等它同步成功(Syncer 帶
#                syncer-suspend、排程器不會自跑,靠 CD 這次觸發)。
#
# deploy.yaml 是部署目標的單一事實來源(namespace + values),本地的 asgard-cli render 讀同一份檔,
# 所以 CI 與本地不會漂。沒宣告任何 env 的 project(目前:website 骨架)整個被跳過。
#
# 新增 project:加 projects/<project>/chart + projects/<project>/deploy.yaml(只宣告要部署的 env)。
# env 合法符號固定為兩個:dev、prod。
#
# 需要的 secrets:AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION。

name: main flow

on:
  push:
    tags:
      - 'dev-[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  setup:
    name: Setup (resolve env + project matrix)
    runs-on: action-runner-scale-set
    outputs:
      env: ${{ steps.env.outputs.env }}
      cluster: ${{ steps.env.outputs.cluster }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve env + cluster from tag
        id: env
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/dev-* ]]; then
            echo "env=dev" >> "${GITHUB_OUTPUT}"
            echo "cluster=asgard-ai-eks" >> "${GITHUB_OUTPUT}"
          else
            echo "env=prod" >> "${GITHUB_OUTPUT}"
            echo "cluster=asgard-ai-eks-prod" >> "${GITHUB_OUTPUT}"
          fi

      # yq 只被下一步的 matrix 用到,但它掛掉就等於整條 CD 掛掉,所以這裡刻意做得韌一點:
      #   1. runner 上已經有 mikefarah yq 就直接用,不對外抓
      #   2. 釘版號,不用 releases/latest/download —— 那個 redirect 是單點,
      #      2026-08-07 就回過一次 HTTP 500,把一次 rollout 卡在這裡
      #   3. --retry 讓暫時性 5xx 自己重試,不必重跑整個 workflow
      #   4. 裝到 RUNNER_TEMP 並寫進 GITHUB_PATH,不需要 sudo /usr/local/bin
      #      (self-hosted runner 不保證有 sudo)
      - name: Install yq
        shell: bash
        env:
          YQ_VERSION: v4.44.3
        run: |
          set -euo pipefail

          if command -v yq >/dev/null 2>&1 && yq --version 2>&1 | grep -qi mikefarah; then
            echo "yq 已存在,沿用:$(yq --version)"
            exit 0
          fi

          case "$(uname -m)" in
            x86_64)          arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::未支援的架構 $(uname -m)"; exit 1 ;;
          esac

          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${arch}" \
            -o "${RUNNER_TEMP}/bin/yq"
          chmod 0755 "${RUNNER_TEMP}/bin/yq"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/yq" --version

      - name: Build project matrix
        id: matrix
        shell: bash
        env:
          DEPLOY_ENV: ${{ steps.env.outputs.env }}
        run: |
          set -euo pipefail

          include=()
          # matrix 由各 project 的 deploy.yaml 驅動:宣告了本次 env 的 project 才長部署 job。
          for dfile in projects/*/deploy.yaml; do
            [ -e "${dfile}" ] || continue
            project="$(basename "$(dirname "${dfile}")")"

            has="$(yq -r ".environments | has(\"${DEPLOY_ENV}\")" "${dfile}")"
            [ "${has}" = "true" ] || { echo "skip ${project}: 未宣告 ${DEPLOY_ENV}"; continue; }

            ns="$(yq -r ".environments.\"${DEPLOY_ENV}\".namespace // \"\"" "${dfile}")"
            values="$(yq -r ".environments.\"${DEPLOY_ENV}\".values // \"\"" "${dfile}")"
            chart="projects/${project}/chart/app/Chart.yaml"
            vpath="projects/${project}/${values}"

            [ -n "${ns}" ]     || { echo "::error::${dfile} 的 ${DEPLOY_ENV} 缺 namespace";        exit 1; }
            [ -n "${values}" ] || { echo "::error::${dfile} 的 ${DEPLOY_ENV} 缺 values";           exit 1; }
            [ -f "${chart}" ]  || { echo "::error::找不到 ${chart}(deploy.yaml 宣告了但無 chart)"; exit 1; }
            [ -f "${vpath}" ]  || { echo "::error::找不到 values 檔 ${vpath}";                      exit 1; }

            include+=("{\"project\":\"${project}\",\"namespace\":\"${ns}\",\"values\":\"${vpath}\"}")
          done

          matrix="{\"include\":[$(IFS=,; echo "${include[*]}")]}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "matrix = ${matrix}"

  deploy:
    name: Deploy ${{ matrix.project }} (${{ needs.setup.outputs.env }} → ${{ matrix.namespace }})
    needs: setup
    runs-on: action-runner-scale-set
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      DEPLOY_ENV: ${{ needs.setup.outputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS CLI
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.0

      - name: Setup kubectl
        shell: bash
        run: |
          set -euo pipefail
          KVER="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLO "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Update kubeconfig
        shell: bash
        run: |
          aws eks update-kubeconfig --name ${{ needs.setup.outputs.cluster }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          project="${{ matrix.project }}"
          namespace="${{ matrix.namespace }}"
          project_values="${{ matrix.values }}"
          chart="projects/${project}/chart/app"
          # release 名 = project 名(asgard-cli render 相同)。
          release="${project}"

          # release tag 蓋進 appVersion(只改 CI checkout、不 commit)。
          # 這裡是必要的、不只是為了版本標示:ss-git-repos 的 Syncer 以
          # revision: {{ .Chart.AppVersion }} 指定要同步本 repo 的哪個 ref,所以 appVersion
          # 必須是這次發布的 tag,否則 Syncer 會去拉一個不存在/過期的 revision。
          sed -i "s/^appVersion: .*/appVersion: ${GITHUB_REF_NAME}/" "${chart}/Chart.yaml"

          # values 疊加:跨 project 共用檔在前、project 檔在後(後者覆蓋前者)。
          # 不帶 --wait:chart 全是 Asgard CR(無 Deployment/Pod),沒有 workload 可等。
          helm upgrade "${release}" "${chart}" --install \
            --namespace "${namespace}" \
            -f "common/values-${DEPLOY_ENV}.yaml" \
            -f "${project_values}" \
            --force-conflicts

      # 技能 Syncer 帶 syncer-suspend=true(排程器不會自己跑),完全靠這一步在部署後觸發一次。
      #
      # ⚠️ **不要改成「跳過 suspended 的 CronJob」** —— suspend 只停排程器,
      #    kubectl create job --from 對 suspended 的 CronJob 照樣有效,而那正是技能同步賴以
      #    運作的機制(internal 兩支 + website 一支技能 Syncer 全是 suspend=true)。
      #    跳過 suspended = 技能永遠不同步。
      #
      # 要讓某支 Syncer 連部署時都別跑,用**明確的退出標籤** asgard-ai.com/syncer-cd-trigger="false"
      # (由各 chart 的 values 控制,per-env)。沒有這個標籤 = 照舊觸發,所以既有行為不變。
      - name: Trigger + wait Syncer sync (${{ matrix.project }})
        shell: bash
        env:
          NAMESPACE: ${{ matrix.namespace }}
        run: |
          set -euo pipefail
          label="asgard-ai.com/syncer-name"
          optout="asgard-ai.com/syncer-cd-trigger"
          appear_timeout="${SYNCER_APPEAR_TIMEOUT:-180}"
          job_timeout="${SYNCER_JOB_TIMEOUT:-600}"

          echo "等待 Syncer CronJob 出現(ns=${NAMESPACE})…"
          deadline=$((SECONDS + appear_timeout))
          cronjobs=""
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            cronjobs="$(kubectl get cronjob -n "${NAMESPACE}" -l "${label}" -o name 2>/dev/null || true)"
            [ -n "${cronjobs}" ] && break
            sleep 5
          done
          if [ -z "${cronjobs}" ]; then
            echo "::error::等了 ${appear_timeout}s 仍無帶 ${label} 的 CronJob;無法觸發 Syncer。"
            exit 1
          fi

          # 退出標籤只在「明確等於 false」時生效;缺標籤或任何其他值都照舊觸發。
          # 這個順序是刻意的:上面的 180s 關卡驗的是「這個 project 到底有沒有 Syncer」
          # (零 Syncer 是設定錯誤),過濾則是「這一輪要不要觸發」,兩件事不該互相掩蓋。
          #
          # ⚠️ 標籤在 **Syncer CR** 上,不在 CronJob 上 —— syncer reconciler 只把
          #    asgard-ai.com/syncer-name 放到它產生的 CronJob 上,不會複製 chart 寫的其他標籤。
          #    (dev-0.0.20 就是直接查 CronJob 而靜靜地沒生效:查不到標籤 = 空字串 = 照舊觸發。)
          #    所以先用 label selector 從 Syncer CR 撈退出名單,再靠 CronJob 自己帶的
          #    syncer-name 標籤對應回去。
          skip="$(kubectl get syncer -n "${NAMESPACE}" -l "${optout}=false" \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"

          eligible=()
          while read -r cj; do
            [ -n "${cj}" ] || continue
            base="$(basename "${cj}")"
            owner="$(kubectl get -n "${NAMESPACE}" "${cj}" \
                       -o jsonpath="{.metadata.labels['asgard-ai\.com/syncer-name']}" 2>/dev/null || true)"
            if [ -n "${owner}" ] && printf '%s\n' "${skip}" | grep -qxF "${owner}"; then
              echo "跳過 ${base}(Syncer/${owner} 標記 ${optout}=false)"
              continue
            fi
            eligible+=("${cj}")
          done < <(printf '%s\n' "${cronjobs}")

          if [ "${#eligible[@]}" -eq 0 ]; then
            echo "本 namespace 的 Syncer 全部標記為不由 CD 觸發,跳過這一步。"
            exit 0
          fi

          jobs=()
          for cj in "${eligible[@]}"; do
            base="$(basename "${cj}")"
            job="${base:0:36}-cd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            kubectl -n "${NAMESPACE}" delete job "${job}" --ignore-not-found >/dev/null 2>&1 || true
            kubectl -n "${NAMESPACE}" create job --from="${cj}" "${job}"
            jobs+=("${job}")
          done

          rc=0
          for job in "${jobs[@]}"; do
            echo "等待 job/${job} 完成…"
            jdeadline=$((SECONDS + job_timeout))
            state=""
            while [ "${SECONDS}" -lt "${jdeadline}" ]; do
              if [ "$(kubectl get job -n "${NAMESPACE}" "${job}" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null)" = "True" ]; then
                state="complete"; break
              fi
              if [ "$(kubectl get job -n "${NAMESPACE}" "${job}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null)" = "True" ]; then
                state="failed"; break
              fi
              sleep 5
            done
            case "${state}" in
              complete) echo "  ✓ ${job} 同步成功" ;;
              failed)
                echo "::error::${job} 同步失敗;狀態與 log:"
                kubectl -n "${NAMESPACE}" describe "job/${job}" | tail -30 || true
                kubectl -n "${NAMESPACE}" logs "job/${job}" --tail=80 --all-containers || true
                rc=1 ;;
              *)
                echo "::error::${job} 在 ${job_timeout}s 內未完成(timeout)。"
                kubectl -n "${NAMESPACE}" describe "job/${job}" | tail -30 || true
                rc=1 ;;
            esac
          done
          exit ${rc}
