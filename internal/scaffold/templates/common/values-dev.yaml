# common / values-dev.yaml
# 跨所有 project 共用的 *dev* 環境值。部署時以 -f 疊加在各 project 的 values 之前:
#   helm ... -f common/values-dev.yaml -f projects/<project>/chart/values-dev.yaml
#
# 目前沒有跨 project 共用值:資料庫座標是 per-project 的事實,放在各
# projects/<project>/chart/values-dev.yaml(每個 DataConnector 一組)。
# 本檔保留為 -f 疊加點與未來的擴充位置。
#
# platformMainEnvironmentId 是 per-project per-env,不放這裡。
# 密碼一律走 cluster Secret(app-secret),不進 values。
